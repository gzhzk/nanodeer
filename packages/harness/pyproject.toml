[project]
name = "nanodeer-ai"
version = "0.1.0"
description = "Lightweight AI Agent Harness — LangGraph-based agent with tool calling, memory, and sandbox isolation"
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "NanoDeer Authors" },
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-minimax>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
docker = ["docker>=7.0.0"]

[project.urls]
Homepage = "https://github.com/GZhzk/nanodeer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanodeer"]

[tool.hatch.build.targets.sdist]
include = ["nanodeer/"]

[tool.ruff]
line-length = 100
target-version = "310"
