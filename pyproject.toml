[project]
name = "nanodeer"
version = "0.1.0"
description = "Lightweight AI Agent Harness — native ReAct agent with tool calling, memory, and sandbox isolation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "NanoDeer Authors" },
]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "duckduckgo-search>=8.1.0",
    "click>=8.0.0",
    "fastapi>=0.115.0",
    "sse-starlette>=2.1.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
docker = ["docker>=7.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
nanodeer = "nanodeer.cli.api:main"
nanodeer-repl = "nanodeer.cli.repl:main"

[project.urls]
Homepage = "https://github.com/gzhzk/nanodeer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanodeer"]

[tool.hatch.build.targets.sdist]
include = ["src/nanodeer/"]

[tool.ruff]
line-length = 100
target-version = "310"
