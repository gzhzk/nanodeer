[project]
name = "nanodeer"
version = "0.1.0"
description = "Lightweight AI Super Agent system with LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "apscheduler>=3.10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
docker = ["docker>=7.0.0"]
feishu = ["lark-oapi>=1.6.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]

[project.scripts]
nanodeer = "nanodeer.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness", "src/app"]

[tool.ruff]
line-length = 100
target-version = "310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
