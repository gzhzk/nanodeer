[project]
name = "nanodeer"
version = "0.1.0"
description = "Lightweight AI Super Agent — Python Kernel + TypeScript Shell"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "NanoDeer Authors" },
]

[project.optional-dependencies]
docker = ["docker>=7.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.workspace]
members = ["packages/nanodeer-kernel"]

[tool.ruff]
line-length = 100
target-version = "310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/nanodeer-kernel/tests"]