[project]
name = "nanodeer-cli"
version = "0.1.0"
description = "NanoDeer CLI — interactive chat and single-shot execution"
requires-python = ">=3.10"
dependencies = [
    "nanodeer-ai",
    "click>=8.0.0",
]

[project.scripts]
nanodeer = "cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.hatch.build.targets.sdist]
include = ["cli/"]
